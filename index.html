<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gimnasio">
<title>Gimnasio</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--card2:#222632;--txt:#eef0f4;--mut:#8b93a5;--acc:#4ade80;--acc2:#22c55e;--red:#f87171;--line:#2a2f3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{padding:16px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:5}
h1{margin:0;font-size:20px}
main{padding:0 16px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.mut{color:var(--mut);font-size:13px}
button{font:inherit;color:var(--txt);background:var(--card2);border:0;border-radius:12px;padding:12px 14px;cursor:pointer}
button.pri{background:var(--acc2);color:#04210f;font-weight:700}
button.ghost{background:transparent;color:var(--mut)}
button.danger{color:var(--red)}
button.wide{width:100%}
input,select,textarea{font:inherit;font-size:16px;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
nav{position:fixed;bottom:0;left:0;right:0;background:#14171d;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border-radius:0;background:transparent;color:var(--mut);padding:14px 2px;font-size:13px}
nav button.on{color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center;font-size:12px}
.stat b{display:block;font-size:20px;color:var(--acc)}
.chip{display:inline-block;background:var(--card2);border-radius:999px;padding:5px 10px;margin:3px 4px 0 0;font-size:13px}
.ent{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ent h3{margin:0 0 2px;font-size:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
canvas{width:100%;height:210px;display:block}
.tog{display:flex;gap:6px;margin:8px 0}
.tog button{flex:1;padding:9px}
.tog button.on{background:var(--acc2);color:#04210f;font-weight:700}
.pr{color:#facc15}
.ico{width:100%;height:100%;fill:none;stroke:var(--txt);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ico .q{stroke:var(--acc);opacity:.85}.ico .hd{fill:var(--txt);stroke:none}
.ibox{width:52px;height:52px;flex:none;background:var(--card2);border-radius:14px;padding:5px}
.ibox.sm{width:40px;height:40px;border-radius:11px;padding:4px}
.ent{align-items:center}
.ent .grow{min-width:0}
.ilist{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.ilist .ibox{width:30px;height:30px;padding:3px;border-radius:9px}
.igrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.igrid button{min-width:0;width:100%;padding:6px;background:var(--card2);border:2px solid transparent;border-radius:12px;aspect-ratio:1}
.igrid button.on{border-color:var(--acc)}
.note{border-left:3px solid var(--acc)}
.note .lbl{font-size:12px;color:var(--mut);margin-top:8px}
.note .lbl:first-child{margin-top:0}
.note p{margin:2px 0 0;white-space:pre-wrap}
.repbox{font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.45}
.rowbtn{display:flex;align-items:center;gap:10px}
.plist{margin-top:8px;max-height:52vh;overflow:auto;border-radius:12px}
.pitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card2);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.pitem .mut{font-size:12px;display:block;margin-top:2px}
.pitem.new{border:1px dashed var(--acc)}
.selbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:4px}
.selbtn .grow{font-weight:600}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;padding:9px 4px;background:transparent;border-radius:10px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card);color:var(--txt);font-weight:700}
.chips2{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.chips2 button{flex:none;padding:7px 12px;border-radius:999px;font-size:13px;background:var(--card2);color:var(--mut)}
.chips2 button.on{background:var(--acc2);color:#04210f;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card2);border-radius:12px;padding:10px 8px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--mut)}
.kpi .d{font-size:11px;color:var(--mut);margin-top:2px}
.kpi .d.up{color:var(--acc)}
.sec{font-size:13px;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.hwrap{display:flex;gap:6px}.hdays{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:9px;color:var(--mut);line-height:1}.hdays span{display:flex;align-items:center}
.heat{flex:1;display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-template-columns:repeat(var(--wk),minmax(0,1fr));gap:3px;max-width:calc(var(--wk) * 26px)}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--card2)}
.heat i.l1{background:#1d5e37}.heat i.l2{background:#22985a}.heat i.l3{background:#4ade80}
.heat i.fut{background:transparent}
.heat i.sel{outline:2px solid var(--txt);outline-offset:1px}
.hleg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mut);margin-top:8px}
.hleg i{width:11px;height:11px;border-radius:3px;display:inline-block;background:var(--card2)}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;border-bottom:1px solid var(--line);padding-top:16px}
.bars button{flex:1;height:100%;display:flex;align-items:flex-end;padding:0;background:transparent;border-radius:0;min-width:0}
.bars button span{display:block;width:100%;background:var(--acc2);border-radius:4px 4px 0 0;min-height:2px}
.bars button.sel span{background:var(--acc)}
.bars button.zero span{background:var(--line)}
.blab{display:flex;gap:4px;margin-top:4px}.blab span{flex:1;text-align:center;font-size:10px;color:var(--mut);min-width:0;overflow:hidden;white-space:nowrap}
.cap{font-size:13px;margin-top:8px;min-height:18px}
.hbar{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.hbar .t{height:10px;background:var(--card2);border-radius:5px;overflow:hidden}.hbar .t span{display:block;height:100%;background:var(--acc2);border-radius:5px}
.hbar .v{color:var(--mut);font-variant-numeric:tabular-nums;font-size:12px}
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);width:100%;background:transparent;border-radius:0;text-align:left}
.trow:first-of-type{border-top:0}
.trow .grow{min-width:0}.trow .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .r{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.trow .r .mut{font-size:11px}
</style>
</head>
<body>
<header><h1>🏋️ Gimnasio</h1></header>
<main id="app"></main>
<nav>
  <button data-t="hoy" class="on">Hoy</button>
  <button data-t="prog">Progreso</button>
  <button data-t="ej">Ejercicios</button>
  <button data-t="hist">Historial</button>
</nav>
<div id="modal"></div>

<script>
const KEY='gymlog_v1';
// Pictogramas de ejercicios: viewBox 0 0 48 48, trazo = currentColor.
// h(x,y) = cabeza; clase "q" = aparato (más tenue).
const h=(x,y)=>`<circle cx="${x}" cy="${y}" r="3.6" class="hd"/>`;
const ICONS={
  press:{t:'Press en banco',s:`<path class="q" d="M6 33h36M11 33v8M37 33v8"/>${h(11,28.5)}<path d="M15 29h15l5-7 4 11M18 29v-12"/><path class="q" d="M9 17h18M10 14v6M26 14v6"/>`},
  incline:{t:'Press inclinado',s:`<path class="q" d="M8 40l20-12h14M28 28v13M14 36v5"/>${h(12,24)}<path d="M15 27l12 6 6-8 4 10M18 29l-2-13"/><path class="q" d="M8 16h16M9 13v6M23 13v6"/>`},
  pulldown:{t:'Jalón / polea alta',s:`<path class="q" d="M24 3v8M11 11h26"/>${h(24,17)}<path class="q" d="M15 33h14"/><path d="M24 21v11h9v9M24 23l-9-11M24 23l9-11"/>`},
  row:{t:'Remo',s:`<path class="q" d="M42 26h4M40 22v14M6 40h40"/>${h(13,15)}<path d="M14 19l3 14h17M15 23l8 4 8-1"/><path class="q" d="M31 26h11"/>`},
  curl:{t:'Bíceps',s:`${h(24,8)}<path d="M24 12v15l-5 14M24 27l5 14M24 15l-6 11M24 15l5 7 2-8"/><path class="q" d="M15 26h6M28 14h6"/>`},
  triceps:{t:'Tríceps en polea',s:`<path class="q" d="M38 3v24M32 27h10"/>${h(20,8)}<path d="M20 12v15l-4 14M20 27l5 14M20 15l4 7 9 4"/>`},
  lateral:{t:'Vuelo lateral',s:`${h(24,8)}<path d="M24 12v15l-5 14M24 27l5 14M24 15H11M24 15h13"/><path class="q" d="M8 12v6M40 12v6"/>`},
  frontal:{t:'Vuelo frontal',s:`${h(20,8)}<path d="M20 12v15l-3 14M20 27l4 14M20 15h15"/><path class="q" d="M38 12v6"/>`},
  shrug:{t:'Trapecio / encogimiento',s:`${h(24,9)}<path d="M24 13v14l-5 14M24 27l5 14M24 15l-7 11M24 15l7 11"/><path class="q" d="M8 26h32M10 22v8M38 22v8"/><path d="M9 13V5M6 8l3-3 3 3M39 13V5M36 8l3-3 3 3"/>`},
  squat:{t:'Sentadilla / piernas',s:`<path class="q" d="M12 14h20"/>${h(19,9)}<path d="M21 13l7 14-10 2 3 12M23 17l-4-3"/><path class="q" d="M4 41h40"/>`},
  crunch:{t:'Abdominales',s:`<path class="q" d="M4 41h40"/>${h(12,26)}<path d="M15 29l9 9 8-9 6 10M14 24l5 3"/>`},
  legraise:{t:'Elevación de piernas',s:`<path class="q" d="M4 41h40"/>${h(8,36)}<path d="M12 37h16V17"/>`},
  plank:{t:'Plancha',s:`<path class="q" d="M4 41h40"/>${h(10,28)}<path d="M14 30l26 6M15 31l-1 9h6M40 36l1 4"/>`},
  fly:{t:'Aperturas / pec deck',s:`${h(24,9)}<path d="M24 13v15l-5 13M24 28l5 13M24 17h-9V8M24 17h9V8"/><path class="q" d="M15 4v6M33 4v6"/><path d="M17 3l4 3-4 3M31 3l-4 3 4 3" class="q"/>`},
  cable:{t:'Polea a un brazo',s:`<path class="q" d="M8 3v38M5 41h6"/>${h(26,9)}<path d="M26 13v14l-4 14M26 27l5 14M26 16l-7 6-3 6"/><path class="q" d="M8 6l8 22"/>`},
  dumbbell:{t:'Genérico',s:`<path class="q" d="M8 18v12M13 15v18M35 15v18M40 18v12"/><path d="M13 24h22"/>`},
  run:{t:'Running',s:`${h(28,8)}<path d="M27 12l-4 13 6 6-2 10M23 25l-7 4-4-2M26 16l-7 3-3 5M26 16l5 6 6-1"/>`},
  walk:{t:'Caminata',s:`${h(24,8)}<path d="M24 12v14l-4 15M24 26l5 6 1 9M24 16l-4 9M24 16l4 8"/>`},
  treadmill:{t:'Cinta',s:`<path class="q" d="M6 40h30l6-4M36 14l4 26M33 14h6"/>${h(22,8)}<path d="M21 12l-3 12 5 5-2 9M18 24l-6 3M21 16l-4 7M21 16l6 3 6-4"/>`},
  bike:{t:'Bici',s:`<circle class="q" cx="11" cy="34" r="7"/><circle class="q" cx="37" cy="34" r="7"/><path class="q" d="M11 34l8-12h12l6 12M19 22l5 12h7M31 22l-2-5"/>${h(22,9)}<path d="M22 13l-2 9 4 12"/>`},
  step:{t:'Step',s:`<path class="q" d="M8 36h32v5H8z"/>${h(24,6)}<path d="M24 10v13l-4 7v6M24 23l6 4v9M24 13l-6 8M24 13l6 8"/>`},
  padel:{t:'Pádel',s:`<ellipse class="q" cx="30" cy="14" rx="9" ry="10"/><path d="M24 22l-12 16"/><path class="q" d="M10 38l-3 4"/><circle cx="12" cy="10" r="3" class="hd"/>`},
  circuit:{t:'Circuito / funcional',s:`<circle class="q" cx="24" cy="27" r="14"/><path class="q" d="M20 9h8M24 9v4"/><path d="M24 27v-8M24 27l6 4"/>`},
  other:{t:'Otro',s:`<path d="M24 6l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z"/>`}
};
const EX_ICONS=['press','incline','pulldown','row','curl','triceps','lateral','frontal','shrug','squat','crunch','legraise','plank','fly','cable','dumbbell'];
const ACT_ICONS=['run','walk','treadmill','bike','step','padel','circuit','other'];
function guessExIcon(n){
  n=(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/plancha|plank/.test(n))return 'plank';
  if(/elevacion de piernas|piernas a 90|leg raise/.test(n))return 'legraise';
  if(/abdom|crunch|oblicu|bicicleta abd/.test(n))return 'crunch';
  if(/inclinad/.test(n))return 'incline';
  if(/apertura|pec ?deck|contractor|deltoides posterior|cruce/.test(n))return 'fly';
  if(/press|banco/.test(n))return 'press';
  if(/jalon|dominad|polea alta/.test(n))return 'pulldown';
  if(/remo/.test(n))return 'row';
  if(/biceps|curl/.test(n))return 'curl';
  if(/triceps|frances/.test(n))return 'triceps';
  if(/lateral/.test(n))return 'lateral';
  if(/frontal/.test(n))return 'frontal';
  if(/trapecio|encogim/.test(n))return 'shrug';
  if(/sentadill|prensa|squat|pierna|cuadric|estocad|zancad|gemelo|femoral/.test(n))return 'squat';
  if(/polea|unilateral|un brazo/.test(n))return 'cable';
  return 'dumbbell';
}
function guessActIcon(n){
  n=(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/cinta/.test(n))return 'treadmill';
  if(/run|corr|trote/.test(n))return 'run';
  if(/camin/.test(n))return 'walk';
  if(/bici|spinning|ciclis/.test(n))return 'bike';
  if(/step/.test(n))return 'step';
  if(/padel|tenis|paleta/.test(n))return 'padel';
  if(/circuit|funcional|crossfit|hiit/.test(n))return 'circuit';
  return 'other';
}
function iconSvg(k,cls){const i=ICONS[k]||ICONS.dumbbell;return `<svg viewBox="0 0 48 48" class="ico ${cls||''}" aria-hidden="true">${i.s}</svg>`}

function exIcon(n){return (S.ex[n]&&S.ex[n].ic)||guessExIcon(n)}
function actIcon(a){return (S.acts[a]&&S.acts[a].ic)||guessActIcon(a)}
function ibox(k,sm){return `<div class="ibox ${sm?'sm':''}">${iconSvg(k)}</div>`}
function iconGrid(list,sel,auto){return `<label>Dibujo</label><div class="igrid" id="igr">${list.map(k=>`<button type="button" data-ic="${k}" title="${ICONS[k].t}" class="${k===(sel||auto)?'on':''}">${iconSvg(k)}</button>`).join('')}</div><div class="mut" id="igt" style="margin-top:4px">${ICONS[sel||auto].t}${sel?'':' (automático)'}</div>`}
function bindGrid(onPick){const g=document.getElementById('igr');g.onclick=ev=>{const b=ev.target.closest('[data-ic]');if(!b)return;g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('igt').textContent=ICONS[b.dataset.ic].t;onPick(b.dataset.ic)}}
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function lastUsedMap(){const m={};Object.keys(S.w).forEach(d=>S.w[d].forEach(e=>{if(e.kind==='f'&&(!m[e.ex]||m[e.ex]<d))m[e.ex]=d}));return m}
const GROUPS={press:'Pecho',incline:'Pecho',fly:'Pecho',pulldown:'Espalda',row:'Espalda',cable:'Espalda',curl:'Bíceps',triceps:'Tríceps',lateral:'Hombros',frontal:'Hombros',shrug:'Hombros',squat:'Piernas',crunch:'Abdomen',legraise:'Abdomen',plank:'Abdomen',dumbbell:'Otros'};
function groupOf(ex){return GROUPS[exIcon(ex)]||'Otros'}
function dayNote(d){return (S.w[d]||[]).find(e=>e.kind==='n')}
function dayHas(d){return (S.w[d]||[]).some(e=>e.kind!=='n')}
const ACTS0=[['Running',1],['Caminata',1],['Step',0],['Padel',0],['Bici',1],['Circuito / funcional',0],['Otro',0]];
function hasKm(a){return !!(S.acts[a]&&S.acts[a].km)}
function findAct(name){const n=name.trim().toLowerCase();return Object.keys(S.acts).find(k=>k.toLowerCase()===n)||null}
function usedAct(name){return Object.values(S.w).some(a=>a.some(e=>e.kind==='c'&&e.act===name))}
const TIPOS={
  kg:{n:'Kg totales (máquina de discos, otro)',lab:'Kg'},
  manc:{n:'Mancuernas (kg por mancuerna)',lab:'Kg c/mancuerna'},
  barra:{n:'Barra con discos (kg por lado + barra)',lab:'Kg por lado'},
  ladrillos:{n:'Máquina con ladrillos (placas)',lab:'Ladrillos'},
  corporal:{n:'Peso corporal (solo repeticiones)',lab:''}
};
let tab='hoy', date=today(), metric='kg', exSel='';

function pad(n){return String(n).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmtD(s){return parseD(s).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}
function shiftD(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function num(v){const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n}
function fmtN(n){return String(Math.round(n*100)/100).replace('.',',')}

/* ---------- datos ---------- */
function defaultEx(){return {
  'Jalón':{tipo:'ladrillos'},'Remo':{tipo:'ladrillos'},'Tríceps':{tipo:'ladrillos'},
  'Press banco plano':{tipo:'barra',bar:20},
  'Bíceps mancuernas':{tipo:'manc'},'Vuelo lateral mancuernas':{tipo:'manc'},'Vuelo frontal mancuernas':{tipo:'manc'},
  'Trapecio':{tipo:'kg'},'Sentadillas':{tipo:'corporal'},'Abdominales':{tipo:'corporal'}}}
function seed(){
  const f=(ex,kg,reps,n)=>({id:uid(),kind:'f',ex,sets:Array.from({length:n},()=>[kg,reps])});
  return {ex:defaultEx(),w:{}};
}
function fixEx(r){
  if(!r.ex)r.ex=defaultEx();
  if(!r.tomb)r.tomb={};
  if(!r.dirty)r.dirty={};
  if(!r.acts){r.acts={};ACTS0.forEach(a=>{r.acts[a[0]]={km:!!a[1]}})}
  Object.values(r.w).forEach(a=>a.forEach(e=>{if(e.kind==='f'&&!r.ex[e.ex])r.ex[e.ex]={tipo:'kg'};if(e.kind==='c'&&!r.acts[e.act])r.acts[e.act]={km:!!e.km}}));
  return r;
}
function load(){let r=null;try{r=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!r||!r.w)r=seed();return fixEx(r)}
let S=load();
function mark(id){(S.dirty=S.dirty||{})[id]=1}
function saveRaw(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){saveRaw();scheduleSync()}

function allEx(){return Object.keys(S.ex).sort((a,b)=>a.localeCompare(b,'es'))}
function findEx(name){const n=name.trim().toLowerCase();return Object.keys(S.ex).find(k=>k.toLowerCase()===n)||null}
function dEx(ex){return S.ex[ex]||{tipo:'kg'}}

/* peso según tipo */
function wlabelT(t,raw){
  if(t.tipo==='corporal')return '';
  if(!raw&&t.tipo!=='barra')return '';
  if(t.tipo==='barra')return fmtN(raw)+' kg/lado → '+fmtN(raw*2+(t.bar||0))+' kg';
  if(t.tipo==='manc')return fmtN(raw)+' kg c/u';
  if(t.tipo==='ladrillos')return fmtN(raw)+(raw===1?' ladrillo':' ladrillos')+(t.pl?' (≈'+fmtN(raw*t.pl)+' kg)':'');
  return fmtN(raw)+' kg';
}
function wlabel(ex,raw){return wlabelT(dEx(ex),raw)}
function prog(ex,raw){const t=dEx(ex);if(t.tipo==='corporal')return 0;if(t.tipo==='barra')return raw*2+(t.bar||0);if(t.tipo==='ladrillos'&&t.pl)return raw*t.pl;return raw}
function punit(ex){const t=dEx(ex);return t.tipo==='ladrillos'&&!t.pl?'ladrillos':t.tipo==='manc'?'kg c/u':'kg'}
function descr(t){
  if(t.tipo==='barra')return 'kg por lado + barra de '+fmtN(t.bar||0)+' kg';
  if(t.tipo==='ladrillos')return 'ladrillos'+(t.pl?' (≈'+fmtN(t.pl)+' kg c/u)':'');
  if(t.tipo==='manc')return 'kg por mancuerna';
  if(t.tipo==='corporal')return 'peso corporal';
  return 'kg totales';
}
function summ(ex,sets){
  const out=[];let i=0;
  while(i<sets.length){let j=i;while(j<sets.length&&sets[j][0]===sets[i][0]&&sets[j][1]===sets[i][1])j++;
    const l=wlabel(ex,sets[i][0]);out.push((j-i)+'×'+sets[i][1]+(l?' @ '+l:''));i=j}
  return out;
}
function lastTime(ex,excl){
  const ds=Object.keys(S.w).filter(d=>d!==excl).sort().reverse();
  for(const d of ds){const e=S.w[d].find(x=>x.kind==='f'&&x.ex===ex);if(e)return {d,sets:e.sets}}
  return null;
}
function pace(min,km){if(!min||!km)return '';const p=min/km;const m=Math.floor(p);const s=Math.round((p-m)*60);return m+':'+pad(s===60?0:s)+' /km'}
function weekStart(s){const d=parseD(s);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function usedEx(name){return Object.values(S.w).some(a=>a.some(e=>e.kind==='f'&&e.ex===name))}

function kgKnown(ex){const t=dEx(ex);return t.tipo!=='corporal'&&!(t.tipo==='ladrillos'&&!t.pl)}
function stats(a,b){ // fechas 'YYYY-MM-DD' inclusive
  const r={days:0,sesF:0,sets:0,reps:0,vol:0,min:0,kcal:0,km:0,g:{},ex:{},act:{},byDay:{}};
  Object.keys(S.w).filter(d=>d>=a&&d<=b).sort().forEach(d=>{
    const es=S.w[d].filter(e=>e.kind!=='n');if(!es.length)return;
    r.days++;r.byDay[d]=es;if(es.some(e=>e.kind==='f'))r.sesF++;
    es.forEach(e=>{
      if(e.kind==='f'){
        const corp=dEx(e.ex).tipo==='corporal';r.sets+=e.sets.length;
        e.sets.forEach(s=>{r.reps+=s[1];if(kgKnown(e.ex))r.vol+=prog(e.ex,s[0])*s[1]});
        const g=groupOf(e.ex);r.g[g]=(r.g[g]||0)+e.sets.length;
        const v=corp?Math.max(...e.sets.map(s=>s[1])):Math.max(...e.sets.map(s=>prog(e.ex,s[0])));
        const x=r.ex[e.ex]||(r.ex[e.ex]={n:0,first:v,last:v,best:v,bd:d,fd:d,ld:d,corp});x.n++;x.last=v;x.ld=d;if(v>x.best){x.best=v;x.bd=d}
      }else{
        r.min+=e.min||0;r.kcal+=e.kcal||0;r.km+=e.km||0;
        const x=r.act[e.act]||(r.act[e.act]={n:0,min:0,km:0,kcal:0,fc:0,fn:0});x.n++;x.min+=e.min||0;x.km+=e.km||0;x.kcal+=e.kcal||0;if(e.fc){x.fc+=e.fc;x.fn++}
      }
    });
  });
  return r;
}
function prsIn(a,b){
  const out=[];
  Object.keys(S.w).filter(d=>d>=a&&d<=b).sort().forEach(d=>S.w[d].forEach(e=>{
    if(e.kind!=='f')return;const bb=bestBefore(e.ex,d);
    const cur=bb.corp?Math.max(...e.sets.map(s=>s[1])):Math.max(...e.sets.map(s=>prog(e.ex,s[0])));
    if(bb.best!=null&&cur>bb.best)out.push({ex:e.ex,d,cur,prev:bb.best,corp:bb.corp});
  }));
  return out.reverse();
}

function dlt(cur,prev,unit){

  return p>0?`<div class="d up">▲ ${p}%</div>`:p<0?`<div class="d">▼ ${-p}%</div>`:'<div class="d">= igual</div>';
}

  Object.keys(S.w).filter(d=>d>=cut).forEach(d=>S.w[d].forEach(e=>{if(e.kind==='c'){cnt[e.act]=(cnt[e.act]||0)+1;if(e.act==='Running')kmT+=e.km||0}}));
  h+=`<div class="card"><div class="mut" style="margin-bottom:8px">Cardio y deportes · últimos 30 días</div>`+
    (Object.keys(cnt).length?Object.entries(cnt).map(([a,n])=>`<span class="chip">${esc(a)}: ${n}</span>`).join('')+(kmT?`<div style="margin-top:8px">Running: <b>${fmtN(kmT)} km</b></div>`:''):'<span class="mut">Sin registros</span>')+`</div>`;
  return h;
}
function exPoints(ex){
  return Object.keys(S.w).sort().map(d=>{const e=S.w[d].find(x=>x.kind==='f'&&x.ex===ex);if(!e)return null;
    const kg=Math.max(...e.sets.map(s=>prog(ex,s[0])));const vol=e.sets.reduce((a,s)=>a+(prog(ex,s[0])||1)*s[1],0);
    return {d,kg,vol:Math.round(vol*10)/10,sets:e.sets}}).filter(Boolean);
}
function drawChart(){
  const cv=document.getElementById('cv');if(!cv||!exSel)return;
  const m=dEx(exSel).tipo==='corporal'?'vol':metric;
  const pts=exPoints(exSel);const vals=pts.map(p=>m==='kg'?p.kg:p.vol);
  const dpr=window.devicePixelRatio||1;const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
  const c=cv.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,W,H);
  let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo=lo*0.8;hi=hi*1.2||1}
  const L=40,R=10,T=14,B=26;const X=i=>pts.length===1?(L+(W-L-R)/2):L+i*(W-L-R)/(pts.length-1);const Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  c.strokeStyle='#2a2f3c';c.fillStyle='#8b93a5';c.font='11px system-ui';c.lineWidth=1;
  for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3,y=Y(v);c.beginPath();c.moveTo(L,y);c.lineTo(W-R,y);c.stroke();c.fillText(String(Math.round(v*10)/10),2,y+4)}
  c.strokeStyle='#4ade80';c.lineWidth=2.5;c.beginPath();vals.forEach((v,i)=>{i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v))});c.stroke();
  vals.forEach((v,i)=>{c.fillStyle=v===hi?'#facc15':'#4ade80';c.beginPath();c.arc(X(i),Y(v),4,0,7);c.fill()});
  c.fillStyle='#8b93a5';const step=Math.max(1,Math.ceil(pts.length/5));
  pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1){const d=parseD(p.d);c.fillText(d.getDate()+'/'+(d.getMonth()+1),Math.min(X(i)-10,W-34),H-8)}});
}

  openM(`<h3 style="margin:0 0 4px">Tarea y notas · <span style="text-transform:capitalize">${fmtD(date)}</span></h3>
  <label>📋 Tarea que te dio el entrenador</label><textarea id="nt" rows="4" placeholder="Pegá o escribí lo que te mandó">${esc(n.tarea||'')}</textarea>
  <label>💬 Comentarios tuyos</label><textarea id="nn" rows="3" placeholder="Ej: me costó la última serie de remo">${esc(n.notes||'')}</textarea>
  <div class="g2" style="margin-top:12px"><button class="ghost" id="nx">Cancelar</button><button class="pri" id="ns">Guardar</button></div>`);
  document.getElementById('nx').onclick=closeM;
  document.getElementById('ns').onclick=()=>{
    const tarea=document.getElementById('nt').value.trim(),notes=document.getElementById('nn').value.trim();
    const ex=dayNote(date);
    if(!tarea&&!notes){if(ex){S.tomb[ex.id]=Date.now();S.w[date]=S.w[date].filter(x=>x!==ex)}}
    else if(ex){ex.tarea=tarea;ex.notes=notes;ex.u=Date.now();mark(ex.id)}
    else{const e={id:uid(),kind:'n',tarea,notes,u:Date.now()};(S.w[date]=S.w[date]||[]).push(e);mark(e.id)}
    save();closeM();render();
  };
}
function bestBefore(ex,d){ // mejor carga (o reps si es peso corporal) antes de la fecha d
  const corp=dEx(ex).tipo==='corporal';let last=null,best=null;
  Object.keys(S.w).filter(x=>x<d).sort().forEach(x=>{const e=S.w[x].find(y=>y.kind==='f'&&y.ex===ex);if(!e)return;
    const v=corp?Math.max(...e.sets.map(s=>s[1])):Math.max(...e.sets.map(s=>prog(ex,s[0])));last=v;best=best==null?v:Math.max(best,v)});
  return {last,best,corp};
}
function buildReport(d){
  const a=S.w[d]||[],n=dayNote(d),f=a.filter(e=>e.kind==='f'),c=a.filter(e=>e.kind==='c');
  const L=[];let up=0,pr=0;
  L.push(`*Entrenamiento · ${fmtD(d).replace(/^./,x=>x.toUpperCase())}*`);
  if(n&&n.tarea)L.push('',`📋 *Tarea:*`,n.tarea);
  if(f.length){
    L.push('','💪 *Fuerza*');
    f.forEach(e=>{
      const b=bestBefore(e.ex,d),cur=b.corp?Math.max(...e.sets.map(s=>s[1])):Math.max(...e.sets.map(s=>prog(e.ex,s[0])));
      let m='';
      if(b.best!=null&&cur>b.best){m=' 🏆';pr++}else if(b.last!=null&&cur>b.last){m=' ⬆️';up++}
      L.push(`• ${e.ex}: ${summ(e.ex,e.sets).join(' + ')}${m}`);
    });
  }
  if(c.length){
    L.push('','🏃 *Cardio / deporte*');
    c.forEach(e=>{const bits=[];if(e.min)bits.push(e.min+' min');if(e.km)bits.push(fmtN(e.km)+' km');if(e.min&&e.km&&hasKm(e.act))bits.push(pace(e.min,e.km));if(e.kcal)bits.push(e.kcal+' kcal');if(e.fc)bits.push('FC '+e.fc);
      L.push(`• ${e.act}${bits.length?': '+bits.join(' · '):''}${e.notes?` (${e.notes})`:''}`)});
  }
  if(n&&n.notes)L.push('',`💬 *Comentarios:* ${n.notes}`);
  if(up||pr)L.push('',`_${[up?'⬆️ más carga que la vez anterior':'',pr?'🏆 mejor marca':''].filter(Boolean).join(' · ')}_`);
  return L.join('\n');
}
function copyTxt(t){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();return Promise.resolve();
}
function modalR(txt,title){
  txt=txt||buildReport(date);
  openM(`<h3 style="margin:0 0 4px">${title||'Informe para el entrenador'}</h3><div class="mut">Podés retocar el texto antes de mandarlo.</div>
  <textarea id="rt" class="repbox" rows="14" style="margin-top:10px">${esc(txt)}</textarea>
  <button class="pri wide" id="rwa" style="margin-top:10px">Enviar por WhatsApp</button>
  <div class="g2" style="margin-top:8px"><button id="rsh">Compartir…</button><button id="rcp">Copiar</button></div>
  <div id="rmsg" class="mut" style="margin-top:6px;min-height:18px"></div>
  <button class="ghost wide" id="rx">Cerrar</button>`);
  const t=()=>document.getElementById('rt').value,msg=m=>{document.getElementById('rmsg').textContent=m};
  document.getElementById('rx').onclick=closeM;
  document.getElementById('rwa').onclick=()=>{window.open('https://wa.me/?text='+encodeURIComponent(t()),'_blank')};
  document.getElementById('rcp').onclick=()=>copyTxt(t()).then(()=>msg('Copiado. Pegalo en el chat con tu entrenador.'),()=>msg('No se pudo copiar.'));
  const sh=document.getElementById('rsh');
  if(navigator.share)sh.onclick=()=>navigator.share({text:t()}).catch(()=>{});else sh.style.display='none';
}

/* ---------- export/import ---------- */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function csv(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['fecha','tipo','ejercicio_actividad','serie','peso_cargado','como_se_mide','peso_total_kg','reps','minutos','km','kcal','fc_prom','notas']];
  Object.keys(S.w).sort().forEach(d=>S.w[d].forEach(e=>{
    if(e.kind==='f'){const t=dEx(e.ex);e.sets.forEach((s,i)=>{const tot=(t.tipo==='ladrillos'&&!t.pl)||t.tipo==='corporal'?'':prog(e.ex,s[0]);rows.push([d,'fuerza',e.ex,i+1,s[0],t.tipo,tot,s[1],'','','','',''])})}
    else if(e.kind==='n')rows.push([d,'nota','','','','','','','','','','',[e.tarea?'Tarea: '+e.tarea:'',e.notes].filter(Boolean).join(' | ')]);
    else rows.push([d,'cardio',e.act,'','','','','',e.min,e.km,e.kcal,e.fc,e.notes]);
  }));
  return rows.map(r=>r.map(q).join(',')).join('\n');
}

function dedupe(){
  const seen={},kill=[];
  Object.keys(S.w).sort().forEach(d=>S.w[d].slice().sort((a,b)=>(a.u||0)-(b.u||0)).forEach(e=>{
    const key=d+'|'+e.kind+'|'+(e.kind==='f'?e.ex+'|'+JSON.stringify(e.sets):e.act+'|'+[e.min,e.km,e.kcal,e.fc,e.notes].join('|'));
    if(seen[key])kill.push({d,id:e.id});else seen[key]=1;
  }));
  if(!kill.length){alert('No hay registros repetidos.');return}
  if(!confirm('Hay '+kill.length+' registros repetidos (mismo día, mismo ejercicio, mismos datos). ¿Borrar las copias y dejar uno solo de cada uno?'))return;
  const now=Date.now();S.tomb=S.tomb||{};
  kill.forEach(k=>{S.tomb[k.id]=now;S.w[k.d]=S.w[k.d].filter(x=>x.id!==k.id)});
  save();render();
}

/* ---------- Google Sheets ---------- */
let syncing=false,syncT=null,syncMsg='';
function cfg(){try{return JSON.parse(localStorage.getItem('gymlog_sync'))||{}}catch(e){return {}}}
function setMsg(m){syncMsg=m;const el=document.getElementById('sst');if(el)el.textContent=m}
function scheduleSync(){if(!cfg().url)return;clearTimeout(syncT);syncT=setTimeout(()=>doSync(),2500)}
function syncCard(){
  const c=cfg();
  return `<div class="card"><b>Google Sheets</b><div class="mut" style="margin:6px 0 4px">${c.url?'Conectado. Se sincroniza solo cada vez que guardás.':'Pegá la URL de tu Apps Script y la clave para sincronizar.'}</div>
  <label>URL del Apps Script</label><input id="sUrl" value="${esc(c.url||'')}" placeholder="https://script.google.com/macros/s/…/exec">
  <label>Clave</label><input id="sTok" type="password" value="${esc(c.token||'')}">
  <div class="g2" style="margin-top:10px"><button class="pri" id="ssave">Guardar y sincronizar</button><button id="ssync">Sincronizar ahora</button></div>
  <div id="sst" class="mut" style="margin-top:8px">${esc(syncMsg)}</div></div>`;
}
function packE(d,e){if(e.kind==='n')return {id:e.id,fecha:d,kind:'n',name:'Nota del día',d:{tarea:e.tarea||'',notes:e.notes||''},u:e.u};return {id:e.id,fecha:d,kind:e.kind,name:e.kind==='f'?e.ex:e.act,d:e.kind==='f'?{sets:e.sets}:{min:e.min,km:e.km,kcal:e.kcal,fc:e.fc,notes:e.notes},u:e.u}}
function unpackE(s){if(s.kind==='n')return {id:s.id,kind:'n',tarea:(s.d&&s.d.tarea)||'',notes:(s.d&&s.d.notes)||'',u:s.u};return s.kind==='f'?{id:s.id,kind:'f',ex:s.name,sets:(s.d&&s.d.sets)||[],u:s.u}:Object.assign({id:s.id,kind:'c',act:s.name,u:s.u},s.d||{})}
function applyServer(j,sent,tombSent){
  S.tomb=S.tomb||{};S.dirty=S.dirty||{};
  // lo que se cambió en este celular mientras viajaba la consulta se conserva
  const keep={};
  Object.keys(S.w).forEach(d=>S.w[d].forEach(e=>{if(S.dirty[e.id]&&sent[e.id]!==e.u)keep[e.id]={d,e}}));
  const nw={};
  (j.entries||[]).forEach(s=>{
    if(s.del||!s.fecha||keep[s.id])return;
    if(S.tomb[s.id]&&!tombSent[s.id])return;
    (nw[s.fecha]=nw[s.fecha]||[]).push(unpackE(s));
  });
  Object.values(keep).forEach(k=>(nw[k.d]=nw[k.d]||[]).push(k.e));
  S.w=nw; // el Sheet es la fuente de verdad: lo borrado allá se borra acá
  Object.keys(sent).forEach(id=>{if(!keep[id])delete S.dirty[id]});
  Object.keys(tombSent).forEach(id=>{if(S.tomb[id]===tombSent[id])delete S.tomb[id]});
  if(j.ex&&(j.cfgU||0)>(S.cfgU||0)){S.ex=j.ex;S.acts=j.acts||S.acts;S.cfgU=j.cfgU}
  fixEx(S);
}
async function doSync(){
  const c=cfg();if(!c.url||syncing)return;
  syncing=true;setMsg('Sincronizando…');
  try{
    S.tomb=S.tomb||{};S.dirty=S.dirty||{};
    const entries=[],sent={};
    Object.keys(S.w).forEach(d=>S.w[d].forEach(e=>{if(S.dirty[e.id]){if(!e.u)e.u=Date.now();entries.push(packE(d,e));sent[e.id]=e.u}}));
    const tombSent=Object.assign({},S.tomb);
    let r;
    try{r=await fetch(c.url,{method:'POST',body:JSON.stringify({t:c.token,entries,tomb:tombSent,ex:S.ex,acts:S.acts,cfgU:S.cfgU||0})})}
    catch(x){throw new Error('no se pudo conectar con el Sheet. Revisá que la URL termine en /exec y que la implementación tenga acceso "Cualquier persona".')}
    const txt=await r.text();let j;
    try{j=JSON.parse(txt)}catch(x){throw new Error('la URL no devolvió datos del script. Revisá el acceso ("Cualquier persona") y que sea la implementación nueva.')}
    if(!j.ok)throw new Error(j.error||'Error');
    applyServer(j,sent,tombSent);saveRaw();
    if(!document.getElementById('modal').innerHTML)render();
    const nl=(j.entries||[]).filter(x=>!x.del&&x.fecha).length;
    const n=new Date();setMsg('Sincronizado '+pad(n.getHours())+':'+pad(n.getMinutes())+' · '+nl+' registros en el Sheet');
  }catch(err){setMsg('No se pudo sincronizar: '+(err.message||err))}
  syncing=false;
}
window.addEventListener('online',scheduleSync);

/* ---------- eventos ---------- */
document.querySelector('nav').addEventListener('click',e=>{const t=e.target.dataset.t;if(t){tab=t;render()}});
document.getElementById('app').addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='prev'){date=shiftD(date,-1);render()}
  else if(t.id==='next'){date=shiftD(date,1);render()}
  else if(t.id==='addF')modalF();
  else if(t.id==='addC')modalC();
  else if(t.id==='addN'||t.closest('#noteC'))modalN();
  else if(t.id==='rep'&&!t.disabled)modalR();
  else if(t.id==='rsum')modalR(buildPeriodReport(),'Resumen para el entrenador');
  else if(t.dataset.pv){pview=t.dataset.pv;render()}
  else if(t.dataset.per){per=t.dataset.per;bsel=-1;render()}
  else if(t.dataset.hd){hsel=hsel===t.dataset.hd?'':t.dataset.hd;render()}
  else if(t.closest('[data-bar]')){bsel=+t.closest('[data-bar]').dataset.bar;render()}
  else if(t.closest('[data-goex]')){exSel=t.closest('[data-goex]').dataset.goex;pview='ex';render();window.scrollTo(0,0)}
  else if(t.id==='newE')modalE('');
  else if(t.id==='newA')modalA('');
  else if(t.id==='ssave'){
    const u=document.getElementById('sUrl').value.trim(),k=document.getElementById('sTok').value.trim();
    if(u&&!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(u)){setMsg('La URL no es la correcta: tiene que ser https://script.google.com/macros/s/…/exec (la que da "Implementar").');return}
    try{localStorage.setItem('gymlog_sync',JSON.stringify({url:u,token:k}))}catch(x){}
    if(u)doSync();else setMsg('Sincronización desactivada');
  }
  else if(t.id==='ssync')doSync();
  else if(t.id==='dedup')dedupe();
  else if(t.dataset.edit)modalEdit(t.dataset.edit);
  else if(t.dataset.del){if(confirm('¿Borrar este registro?')){S.tomb[t.dataset.del]=Date.now();S.w[date]=S.w[date].filter(x=>x.id!==t.dataset.del);save();render()}}
  else if(t.dataset.m){metric=t.dataset.m;render()}
  else if(t.id==='expC')dl('gimnasio.csv',csv(),'text/csv');
  else if(t.id==='expJ')dl('gimnasio.json',JSON.stringify(S),'application/json');
  else if(t.id==='impJ')document.getElementById('fl').click();
  else{
    const ed=t.closest('[data-ed]');if(ed){modalE(ed.dataset.ed);return}
    const ea=t.closest('[data-ea]');if(ea){modalA(ea.dataset.ea);return}
    const c=t.closest('[data-go]');if(c){date=c.dataset.go;tab='hoy';render()}
  }
});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='dt'&&e.target.value){date=e.target.value;render()}
  if(e.target.id==='exsel'){exSel=e.target.value;render()}
  if(e.target.id==='fl'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.w)throw 0;if(confirm('Esto reemplaza los datos actuales. ¿Seguir?')){S=fixEx(o);S.dirty={};Object.values(S.w).forEach(a=>a.forEach(x=>mark(x.id)));save();render()}}catch(x){alert('Archivo inválido')}};r.readAsText(f)}
});
window.addEventListener('resize',()=>{if(tab==='prog')drawChart()});
render();
if(cfg().url)doSync();
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
</script>
